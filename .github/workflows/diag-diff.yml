name: DIAG Diff (read-only)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Repo-Inhalt abrufen
        uses: actions/checkout@v4

      - name: paramiko installieren
        run: pip install paramiko >/dev/null

      - name: Abgleich Juni-Backup vs. Server
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/diag_log.py
