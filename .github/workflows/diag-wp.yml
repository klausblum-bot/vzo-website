name: diag-wp

# TEMPORAER: read-only Diagnose des WordPress-Fehlers (HTTP 500) auf dem
# selben Host, auf dem /public_html/neu/ liegt. Nur workflow_dispatch,
# aendert nichts am Server. Nach der Analyse wieder entfernen.

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: paramiko installieren
        run: pip install paramiko >/dev/null

      - name: Diagnose (read-only)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python3 .github/diag.py
